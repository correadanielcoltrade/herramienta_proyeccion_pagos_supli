<section class="panel module" id="module-vendors">
  <div class="page-header">
    <div>
      <h2>Proveedores</h2>
      <p>Gestiona proveedores, su tipo y categoría de prioridad.</p>
    </div>
    <div class="header-actions">
      <button class="btn primary" id="vendor-open">Nuevo proveedor</button>
      <button class="btn danger" id="vendor-bulk-delete" disabled>Eliminar seleccionados</button>
    </div>
  </div>

  <div class="catalog-toolbar">
    <div class="catalog-toolbar-filters">
      <input type="search" id="vendors-search" class="table-search" placeholder="Buscar proveedor">
      <select id="vendor-filter-category">
        <option value="">Todas las categorías</option>
        <option value="Alta">Alta</option>
        <option value="Media">Media</option>
        <option value="Baja">Baja</option>
        <option value="Normal">Normal</option>
      </select>
    </div>
    <div class="catalog-toolbar-right">
      <button class="btn outline small" id="vendor-export">Exportar Excel</button>
      <button class="btn outline small" id="vendor-template">Template Excel</button>
      <form id="vendor-upload-form" class="inline-form">
        <input type="file" name="file" accept=".xlsx">
        <button type="submit" class="btn secondary small">Importar</button>
      </form>
    </div>
  </div>

  <div class="panel table-panel">
    <div class="table-header">
      <h3>Listado de proveedores</h3>
      <label class="table-select-all">
        <input type="checkbox" id="vendor-select-all"> Seleccionar todo
      </label>
    </div>
    <div class="table-wrapper">
      <table id="vendors-table">
        <thead>
          <tr>
            <th class="catalog-select-col"></th>
            <th>Proveedor</th>
            <th>Categoría</th>
            <th>Estado</th>
            <th>Tipo</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="table-footer" data-table="vendors-table"></div>
  </div>
</section>
