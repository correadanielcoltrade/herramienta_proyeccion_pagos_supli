<section class="panel module" id="module-brands">
  <div class="module-header">
    <h3>Marcas</h3>
    <div class="header-actions catalog-header-actions">
      <div class="catalog-search">
        <input type="search" id="brands-search" class="table-search" placeholder="Buscar marca">
      </div>
      <div class="catalog-buttons">
        <button class="btn primary" id="brand-open">Nueva marca</button>
        <button class="btn danger" id="brand-bulk-delete" disabled>Eliminar seleccionados</button>
      </div>
    </div>
  </div>
  <div class="inline-actions">
    <button class="btn outline small" id="brand-template">Template Excel</button>
    <form id="brand-upload-form" class="inline-form">
      <input type="file" name="file" accept=".xlsx">
      <button type="submit" class="btn secondary small">Importar</button>
    </form>
  </div>
  <div class="table-wrapper compact">
    <table id="brands-table">
      <thead>
        <tr>
          <th class="catalog-select-col"><input type="checkbox" id="brand-select-all"></th>
          <th>Marca</th>
          <th>Categoria</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="table-footer" data-table="brands-table"></div>
</section>
