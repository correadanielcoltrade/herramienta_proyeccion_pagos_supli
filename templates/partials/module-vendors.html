<section class="panel module" id="module-vendors">
  <div class="module-header">
    <h3>Proveedores</h3>
    <div class="header-actions catalog-header-actions">
      <div class="catalog-search">
        <input type="search" id="vendors-search" class="table-search" placeholder="Buscar proveedor">
      </div>
      <div class="catalog-buttons">
        <button class="btn primary" id="vendor-open">Nuevo proveedor</button>
        <button class="btn danger" id="vendor-bulk-delete" disabled>Eliminar seleccionados</button>
      </div>
    </div>
  </div>
  <div class="inline-actions">
    <button class="btn outline small" id="vendor-template">Template Excel</button>
    <form id="vendor-upload-form" class="inline-form">
      <input type="file" name="file" accept=".xlsx">
      <button type="submit" class="btn secondary small">Importar</button>
    </form>
  </div>
  <div class="table-wrapper compact">
    <table id="vendors-table">
      <thead>
        <tr>
          <th class="catalog-select-col"><input type="checkbox" id="vendor-select-all"></th>
          <th>Proveedor</th>
          <th>Categoria</th>
          <th>Status</th>
          <th>Tipo</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="table-footer" data-table="vendors-table"></div>
</section>
